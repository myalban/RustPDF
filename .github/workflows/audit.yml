name: Security audit

# Checks the dependencies against the RustSec advisory database: weekly, and whenever the lock file changes.
on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    paths: ['Cargo.lock']
  pull_request:
    paths: ['Cargo.lock']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

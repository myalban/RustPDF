name: Security audit

# Checks the dependencies against the RustSec advisory database: weekly, and whenever the lock file changes.
on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main, master, develop]
    paths: ['Cargo.lock']
  pull_request:
    paths: ['Cargo.lock']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
